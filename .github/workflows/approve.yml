name: 承認の記録

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: 実際のマージ状況を確認（レビュー後にマージが完了している場合があるため）
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MERGED=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json merged --jq .merged)
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.status.outputs.merged == 'true' && 'main' || github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 稟議番号を取り出して台帳へ記入
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEWED_AT: ${{ github.event.review.submitted_at }}
        run: python3 tools/approve.py

      - name: 台帳の更新をPRのブランチへ反映（未マージの場合）
        if: steps.status.outputs.merged == 'false'
        run: |
          if git diff --quiet ledger/; then
            echo "台帳に変更はありません"
            exit 0
          fi
          git config user.name "sky-lab"
          git config user.email "sky-lab@users.noreply.github.com"
          git add ledger/
          git commit -m "承認を記録"
          git push

      - name: 台帳の更新を新しいPRとしてmainへ反映（マージ済みの場合）
        if: steps.status.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet ledger/; then
            echo "台帳に変更はありません"
            exit 0
          fi
          git config user.name "sky-lab"
          git config user.email "sky-lab@users.noreply.github.com"
          BRANCH="record-approval/${SOURCE_PR}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add ledger/
          git commit -m "承認を記録（元PR #${SOURCE_PR}、マージ後の承認のため新規PRで反映）"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "承認記録の反映：元PR #${SOURCE_PR}" \
            --body "PR #${SOURCE_PR} は既にマージ済みのため、そのブランチへの書き込みではmainに届きません。この承認記録を新しいPRとして届けます。承認者・時刻ともGitHubのレビュー操作から取得した値で、新しい判断は含まれません。" \
            --base main --head "$BRANCH"
