name: 公開前セキュリティ検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 情報漏れの検査
        run: python3 tools/guard.py

      - name: 未承認公開の検査
        run: python3 tools/approved_only.py
